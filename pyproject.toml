[project]
name = "tts-wyoming-piper"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = ["wyoming>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999", "UP035", "UP006"]
"wyoming_client.py" = ["UP035", "UP006"]
