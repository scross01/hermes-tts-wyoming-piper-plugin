[project]
name = "tts-wyoming-piper"
version = "0.2.1"
requires-python = ">=3.9"
dependencies = ["wyoming>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999", "UP035", "UP006", "UP045", "UP037", "S110", "BLE001", "PLW1510", "SIM114", "PIE790", "PYI034", "PYI036", "SIM117"]
"wyoming_client.py" = ["UP035", "UP006", "UP045", "UP037", "S110", "BLE001", "SIM114", "PIE790", "PYI034", "PYI036", "F401"]
