name: tts-wyoming-piper
version: 0.3.0
description: "TTS provider using Wyoming Protocol to connect to remote Piper services"
author: scross01
license: MIT

config:
  host:
    type: string
    default: "localhost"
    description: "Wyoming Piper server hostname"
  port:
    type: integer
    default: 10200
    description: "Wyoming Piper server port"
  voice:
    type: string
    default: ""
    description: "Voice name (leave empty for server default)"
  timeout:
    type: integer
    default: 10
    description: "Connection timeout in seconds"
  mode:
    type: string
    default: "pipe"
    description: "Synthesis mode: pipe (direct PCM→Opus, 1 conversion) or stream (streaming delivery)"
  output_format:
    type: string
    default: "mp3"
    description: "Output audio format: mp3 (universal), ogg (voice bubbles), wav (lossless), flac (compressed lossless)"
  voice_compatible:
    type: boolean
    default: false
    description: "Declare output as already voice-bubble compatible (OGG/Opus). When false, Hermes handles platform-specific conversion."
  debug:
    type: boolean
    default: false
    description: "Enable verbose debug logging to ~/.hermes/logs/wyoming-piper-debug.log"

tools: []
